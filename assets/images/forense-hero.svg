<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 500" role="img" aria-labelledby="title desc">
  <title id="title">CPU, redes y análisis forense</title>
  <desc id="desc">Ilustración envolvente de un procesador, nodos de red y un panel de investigación forense.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#0b1f38"/>
      <stop offset="100%" stop-color="#123b74"/>
    </linearGradient>
    <linearGradient id="chip" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#60a5fa"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
    <linearGradient id="node" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#14b8a6"/>
      <stop offset="100%" stop-color="#2dd4bf"/>
    </linearGradient>
  </defs>
  <rect width="640" height="500" rx="28" fill="url(#bg)"/>
  <circle cx="130" cy="120" r="86" fill="#1e3a8a" opacity="0.28"/>
  <circle cx="520" cy="390" r="116" fill="#0f766e" opacity="0.22"/>

  <g transform="translate(52 110)">
    <rect x="0" y="0" width="250" height="190" rx="26" fill="url(#chip)" stroke="#93c5fd" stroke-width="3"/>
    <text x="125" y="92" text-anchor="middle" font-size="40" fill="#f8fafc" font-family="Arial, sans-serif" font-weight="700">CPU</text>
    <rect x="38" y="118" width="66" height="36" rx="10" fill="#dbeafe" opacity="0.9"/>
    <rect x="120" y="118" width="86" height="36" rx="10" fill="#dbeafe" opacity="0.9"/>
    <rect x="44" y="28" width="162" height="26" rx="10" fill="#dbeafe" opacity="0.35"/>
  </g>

  <g transform="translate(390 80)">
    <rect x="0" y="40" width="150" height="60" rx="16" fill="#dbeafe"/>
    <text x="75" y="78" text-anchor="middle" font-size="24" fill="#0f172a" font-family="Arial, sans-serif" font-weight="700">ALU</text>
    <rect x="0" y="130" width="150" height="60" rx="16" fill="#dbeafe"/>
    <text x="75" y="168" text-anchor="middle" font-size="22" fill="#0f172a" font-family="Arial, sans-serif" font-weight="700">UC</text>
    <rect x="0" y="220" width="150" height="60" rx="16" fill="#dbeafe"/>
    <text x="75" y="258" text-anchor="middle" font-size="22" fill="#0f172a" font-family="Arial, sans-serif" font-weight="700">Regs</text>
  </g>

  <g fill="url(#node)">
    <circle cx="132" cy="395" r="12"/>
    <circle cx="252" cy="350" r="12"/>
    <circle cx="392" cy="330" r="12"/>
    <circle cx="515" cy="395" r="12"/>
  </g>
  <g stroke="#2dd4bf" stroke-width="4" fill="none">
    <path d="M132 395 L252 350 L392 330 L515 395" opacity="0.7"/>
    <path d="M252 350 L290 280" opacity="0.8"/>
    <path d="M392 330 L450 285" opacity="0.8"/>
  </g>

  <g>
    <rect x="218" y="370" width="200" height="80" rx="18" fill="#112a43" opacity="0.88"/>
    <text x="318" y="410" text-anchor="middle" font-size="23" fill="#f8fafc" font-family="Arial, sans-serif" font-weight="700">Forensic Analysis</text>
  </g>
</svg>
